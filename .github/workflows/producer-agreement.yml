name: Producer Agreement

# The suite never imports ModelSwapBench at runtime: it reads the
# model-swap-evidence.v1 document and recomputes the decision itself. This job
# proves the two decision rules agree, by installing ModelSwapBench from its
# main branch and feeding a grid of its real output through this reader. The
# same check runs from the other side in ModelSwapBench's suite-contract job.
#
# Its own workflow so it can carry a schedule: ModelSwapBench changes on its
# own cadence, and a nightly run surfaces a divergence within a day.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install ModelSwapBench from its main branch
        # The writer is not yet in a published release. Installed for this job
        # only; the agreement test skips when it is absent so the offline
        # matrix stays offline.
        run: |
          python -m pip install "git+https://github.com/sekacorn/ModelSwapBench.git@main"
          python -c "import model_swap_bench as m; print('modelswapbench', m.__version__)"
      - name: Check the two decision rules agree
        # The variable turns a missing producer into a failure, so a botched
        # install can never report this check as passing.
        env:
          AI_SUITE_REQUIRE_PRODUCER_AGREEMENT: "1"
        run: python -m pytest -v -o addopts="" tests/test_model_swap_evidence.py -k agreement
