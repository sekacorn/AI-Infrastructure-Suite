name: CI

# This repository intentionally contains NO publishing workflow. CI builds
# artifacts and validates their metadata, but never uploads them anywhere.
# See docs/release-policy.md for what a future release workflow must require.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

  test:
    name: Test py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The console output layer is encoding-sensitive; cover Windows once.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          ai-suite --help
          ai-suite version
          ai-suite components
          ai-suite extras
          ai-suite info
          ai-suite doctor --json
          ai-suite doctor --no-imports --json
          ai-suite compatibility --json
          ai-suite manifest
          python -m ai_infrastructure_suite version

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Bandit
        run: bandit -c pyproject.toml -r src

      - name: pip-audit
        run: pip-audit --strict

  build:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: twine check --strict dist/*

      - name: Inspect wheel metadata
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys

          wheel = next(iter(sorted(pathlib.Path("dist").glob("*.whl"))))
          names = zipfile.ZipFile(wheel).namelist()
          metadata = next(n for n in names if n.endswith(".dist-info/METADATA"))
          text = zipfile.ZipFile(wheel).read(metadata).decode("utf-8")
          print(text.split("\n\n", 1)[0])

          required = [
              "Name: ai-infrastructure-suite",
              "Author: sekacorn",
              "License-Expression: Apache-2.0",
              "Requires-Python: >=3.11,<3.14",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              sys.exit(f"missing wheel metadata: {missing}")

          # The manifest must ship as a real package resource.
          if not any(n.endswith("data/ecosystem-manifest.json") for n in names):
              sys.exit("ecosystem-manifest.json is missing from the wheel")
          print("wheel metadata OK")
          PY

      - name: Scan artifacts for personal data and secrets
        run: python scripts/scan_artifacts.py dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  install-smoke:
    name: Fresh install from ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the built artifact outside any source tree
        working-directory: /tmp
        run: |
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          else
            python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          fi

      - name: Verify the installed console script
        working-directory: /tmp
        run: |
          ai-suite version
          ai-suite components
          ai-suite doctor --json
          ai-suite compatibility --json
          ai-suite manifest > /tmp/manifest.json
          python -c "import json; assert len(json.load(open('/tmp/manifest.json'))['components']) == 7"

      - name: Verify the core components resolved
        working-directory: /tmp
        run: |
          python - <<'PY'
          import json, subprocess
          raw = subprocess.run(
              ["ai-suite", "doctor", "--json"], capture_output=True, text=True, check=False
          ).stdout
          report = json.loads(raw)
          for component in report["components"]:
              status = component["status"]
              if component["installed_by_default"] and status != "ok":
                  raise SystemExit(f"{component['distribution']} is {status}, expected ok")
              if not component["installed_by_default"] and status != "optional":
                  raise SystemExit(f"{component['distribution']} is {status}, expected optional")
          print("default install resolved correctly:", report["summary"])
          PY
