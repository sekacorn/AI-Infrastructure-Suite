name: CI

# This repository intentionally contains NO publishing workflow. CI builds
# artifacts and validates their metadata, but never uploads them anywhere.
# See docs/release-policy.md for what a future release workflow must require.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

  test:
    name: Test py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The console output layer is encoding-sensitive; cover Windows once.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          ai-suite --help
          ai-suite version
          ai-suite components
          ai-suite extras
          ai-suite info
          ai-suite doctor --json
          ai-suite doctor --no-imports --json
          ai-suite compatibility --json
          ai-suite manifest
          python -m ai_infrastructure_suite version

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # setup-python pre-installs a build toolchain into the runner. It is not a
      # dependency of this package — a user's install contains only pip — but
      # pip-audit audits the whole environment, so a stale ambient setuptools
      # reports as a finding. Upgrade it rather than suppress the finding.
      - name: Upgrade ambient build toolchain
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Bandit
        run: bandit -c pyproject.toml -r src scripts

      # Not --strict: this package is not on PyPI, so pip-audit cannot audit the
      # project itself, and --strict escalates that unavoidable skip to an error.
      # Plain pip-audit still exits non-zero when a real vulnerability is found.
      - name: pip-audit
        run: pip-audit

  build:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install build twine packaging

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: twine check --strict dist/*

      - name: Inspect artifact metadata
        run: python scripts/check_metadata.py dist

      - name: Scan artifacts for personal data and secrets
        run: python scripts/scan_artifacts.py dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  install-smoke:
    name: Fresh install from ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        artifact: [wheel, sdist]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the built artifact outside any source tree
        working-directory: /tmp
        run: |
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          else
            python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          fi

      - name: Verify the installed console script
        working-directory: /tmp
        run: |
          ai-suite version
          ai-suite components
          ai-suite doctor --json
          ai-suite compatibility --json
          ai-suite manifest > /tmp/manifest.json
          python -c "import json; assert len(json.load(open('/tmp/manifest.json'))['components']) == 7"

      - name: Verify the core components resolved
        working-directory: /tmp
        run: |
          python - <<'PY'
          import json, subprocess
          raw = subprocess.run(
              ["ai-suite", "doctor", "--json"], capture_output=True, text=True, check=False
          ).stdout
          report = json.loads(raw)
          for component in report["components"]:
              status = component["status"]
              if component["installed_by_default"] and status != "ok":
                  raise SystemExit(f"{component['distribution']} is {status}, expected ok")
              if not component["installed_by_default"] and status != "optional":
                  raise SystemExit(f"{component['distribution']} is {status}, expected optional")
          print("default install resolved correctly:", report["summary"])
          PY
